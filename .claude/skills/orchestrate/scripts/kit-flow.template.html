<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kit Trigger Flow</title>
<style>
:root{--bg:#f4f6fb;--panel:#ffffff;--panel2:#f8fafd;--lane:#fbfcfe;--ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#e3e8f0;--line2:#cfd7e3;
--chip:#eef2f8;--accent:#4f46e5;--accent-soft:#eef0ff;--hi:#f59e0b;--bad:#e5484d;--ok:#10b981;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);
--route:#4f46e5;--scoped:#8b5cf6;--hook:#e5484d;--spawn:#0ea5a4;--index:#94a3b8;--loads:#d97706;--calls:#10b981;--mention:#cbd5e1;
--k-root:#0f172a;--k-rule:#475569;--k-skill:#4f46e5;--k-workflow:#0ea5a4;--k-agent:#8b5cf6;--k-hook:#e5484d;--k-ref:#d97706;--k-script:#10b981;--k-other:#94a3b8;
--mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0e16;--panel:#111723;--panel2:#0d131e;--lane:#0f1520;--ink:#e6eaf2;--ink2:#c3cad8;--muted:#8b97ab;--line:#1e2635;--line2:#2a3446;
--chip:#182133;--accent:#818cf8;--accent-soft:#1c2140;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);--k-root:#e6eaf2;--k-rule:#a5b1c6;--mention:#3a4458;--index:#64718a;--route:#818cf8}}
:root[data-theme=dark]{--bg:#0a0e16;--panel:#111723;--panel2:#0d131e;--lane:#0f1520;--ink:#e6eaf2;--ink2:#c3cad8;--muted:#8b97ab;--line:#1e2635;--line2:#2a3446;
--chip:#182133;--accent:#818cf8;--accent-soft:#1c2140;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);--k-root:#e6eaf2;--k-rule:#a5b1c6;--mention:#3a4458;--index:#64718a;--route:#818cf8}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:13px/1.5 "Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
header{flex:none;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 20px}.spacer{flex:1}
.brand{display:flex;align-items:center;gap:12px}.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#0ea5a4);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.35)}
h1{font-size:16px;font-weight:650;letter-spacing:-.01em;margin:0}.meta{color:var(--muted);font-size:12px}
.search{position:relative;display:flex;align-items:center}.search svg{position:absolute;left:10px;opacity:.55;pointer-events:none}
input[type=search]{width:280px;max-width:60vw;padding:7px 12px 7px 32px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);outline:none;transition:border-color .15s,box-shadow .15s}
input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{padding:6px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--panel2)}
button{border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:6px 12px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:var(--chip)}button.icon{width:34px;height:34px;padding:0;display:grid;place-items:center}
button.warn{background:var(--bad);color:#fff;border-color:var(--bad)}button.good{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;color:var(--ink2);font-size:12.5px}
.switch input{appearance:none;-webkit-appearance:none;width:30px;height:18px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked{background:var(--accent)}.switch input:checked::after{left:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;padding:0 20px 14px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}.kpi b{display:block;font-size:19px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}
.kpi .bar{height:4px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}.kpi .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#0ea5a4)}
.tabsrow{padding-top:0;padding-bottom:0;border-top:1px solid var(--line)}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}nav.tabs button{border:0;border-radius:0;background:transparent;padding:12px 12px 10px;color:var(--muted);font-weight:550;border-bottom:2px solid transparent}
nav.tabs button:hover{color:var(--ink);background:transparent}nav.tabs button.act{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .cnt{margin-left:6px;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--muted)}nav.tabs .cnt.bad{background:var(--bad);color:#fff}
.toggles{display:flex;flex-wrap:wrap;gap:6px}.tg{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;user-select:none;font-size:12px;color:var(--ink2);transition:opacity .15s}
.tg i{width:14px;height:3px;border-radius:2px;display:inline-block}.tg.off{opacity:.38}
.flowonly{display:contents}body:not([data-tab=flow]) .flowonly{display:none}
main{flex:1;min-height:0;display:flex}.view{flex:1;overflow:auto;position:relative;display:none}.view.act{display:block}
#v-flow{padding:6px 0 0 16px;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
#canvas{position:relative;margin:0 0 40px}#canvas>svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}#top{z-index:6}
.colhead{position:absolute;top:10px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10.5px}
.lane{position:absolute;border-radius:14px;background:var(--lane);border:1px solid var(--line);box-shadow:var(--shadow)}
.lanehead{position:absolute;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;color:var(--ink2);cursor:pointer;user-select:none;z-index:4}
.lanehead .car{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:6px;background:var(--chip);font-size:10px;color:var(--muted)}
.lanehead .sub{font-weight:450;color:var(--muted)}.lanehead .warnc{color:var(--hi);font-weight:600}
.n{position:absolute;z-index:3;height:26px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--ink2);transition:opacity .15s,box-shadow .15s,border-color .15s}
.n:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.n b{width:8px;height:8px;border-radius:3px;flex:none}.n.local{border-style:dashed}.n.bad{box-shadow:inset 3px 0 0 var(--bad)}.n.acc{box-shadow:inset 3px 0 0 var(--hi)}
.n.big{height:32px;font-weight:650;font-size:13px;color:var(--ink);box-shadow:var(--shadow)}.n.big b{width:10px;height:10px}
.n .tag{margin-left:auto;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.n.chip{background:transparent;border-style:dashed;color:var(--muted);font-size:11.5px}
.dim .n:not(.on){opacity:.18}.n.sel{border-color:var(--hi);box-shadow:0 0 0 3px color-mix(in srgb,var(--hi) 30%,transparent)}.n.match{border-color:var(--hi);border-style:dashed}
#base path{fill:none;stroke-width:1.4;opacity:.5}.dim #base path{opacity:.06}#top path{fill:none;stroke-width:2.2;opacity:1}
.pad{padding:20px 24px}
.sect{font-size:11px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sect:first-child{margin-top:0}.sect .meta{text-transform:none;letter-spacing:0;font-weight:400}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--line2);transform:translateY(-1px)}.card h3{margin:0;font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h3 b{width:10px;height:10px;border-radius:3px;flex:none}.card h3 .pill{margin-left:auto}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:10px 0 0;font-size:12.5px}.card dt{color:var(--muted);font-weight:650;white-space:nowrap;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}.card dd{margin:0;color:var(--ink2)}
.card.hasiss{box-shadow:inset 3px 0 0 var(--bad),var(--shadow)}
table.t{border-collapse:separate;border-spacing:0;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12.5px;margin:0 0 22px;box-shadow:var(--shadow)}
.t th,.t td{text-align:left;vertical-align:top;padding:8px 12px;border-bottom:1px solid var(--line)}.t th{background:var(--panel2);font-weight:650;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.t tbody tr:hover td{background:var(--panel2)}#ftab th{cursor:pointer}#ftab th:hover{color:var(--ink)}.t tr:last-child td{border-bottom:0}.t td.p{font-family:var(--mono);font-size:11.5px;word-break:break-all}.t td.num{text-align:right;font-variant-numeric:tabular-nums}
code{font-family:var(--mono);font-size:11.5px;background:var(--chip);padding:1px 5px;border-radius:5px}
.gl{display:inline-block;margin:2px 4px 0 0;padding:1px 8px;border-radius:999px;background:var(--accent-soft);font-size:11.5px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;background:var(--chip);color:var(--ink2);white-space:nowrap}
.pill.entry,.pill.structural{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.pill.none,.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}.pill.mention-only{background:color-mix(in srgb,var(--hi) 18%,transparent);color:var(--hi)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
aside{width:400px;max-width:42vw;border-left:1px solid var(--line);background:var(--panel);padding:18px 20px;overflow:auto}
aside h2{font-size:15px;font-weight:650;margin:0 0 4px}aside h3{font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px}
aside .path{font-family:var(--mono);font-size:11.5px;color:var(--muted);word-break:break-all}
.kind{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--chip);font-size:11px;font-weight:600;margin:8px 6px 4px 0;color:var(--ink2)}
.trig{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:12.5px;color:var(--ink2)}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0;color:var(--muted)}.chain a{padding:2px 8px;border-radius:7px;background:var(--accent-soft)}
a[data-go]{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:550}a[data-go]:hover{text-decoration:underline}
.lst{margin:4px 0 10px;padding:0;list-style:none}.lst li{padding:5px 0;font-size:12.5px;border-bottom:1px dashed var(--line)}.et{display:inline-block;min-width:64px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.iss{padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}.iss em{font-style:normal;font-weight:650;color:var(--bad)}
.empty{display:flex;align-items:center;gap:12px;padding:16px 18px;border:1px dashed var(--line2);border-radius:12px;color:var(--muted);background:var(--panel)}.empty b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.legend{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:12px;color:var(--muted);margin-top:12px;align-items:center}
@media (max-width:760px){main{flex-direction:column}.view{min-height:70vh}aside{width:auto;max-width:none;border-left:0;border-top:1px solid var(--line)}.cards{grid-template-columns:1fr}
 .row,.kpis{padding-left:16px;padding-right:16px}.search{flex:1}input[type=search]{width:100%;max-width:none}}
</style></head><body>
<header>
<div class="row"><div class="brand"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2.4"/><circle cx="19" cy="6" r="2.4"/><circle cx="12" cy="18" r="2.4"/><path d="M7.2 7.2 10.6 16M16.8 7.2 13.4 16M7.4 6h9.2"/></svg></span>
<div><h1>Kit trigger flow</h1><div class="meta" id="meta"></div></div></div>
<span class="spacer"></span>
<span class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" placeholder="Search files and triggers…"></span>
<label class="switch" title="Reload every 5 s (run kit-flow.py --watch)"><input type="checkbox" id="live">Live</label>
<button id="theme" class="icon" title="Theme: auto / dark / light">◐</button></div>
<div class="kpis" id="kpis"></div>
<div class="row tabsrow"><nav class="tabs" id="tabs"></nav><span class="spacer"></span>
<span class="flowonly"><span class="toggles" id="tgs"></span><button id="expandAll">Expand all</button><button id="collapseAll">Collapse all</button></span>
<button id="issuesBtn"></button></div>
</header>
<main>
<div class="view" id="v-flow"><div id="canvas"><svg id="base"></svg><svg id="top"></svg></div></div>
<div class="view pad" id="v-trig"></div>
<div class="view pad" id="v-router"></div>
<div class="view pad" id="v-files"></div>
<div class="view pad" id="v-issues"></div>
<aside id="side"></aside></main>
<script>
const D = __DATA__;
const ET = {route:'Route: always-loaded text names the trigger',scoped:'Scoped rule',hook:'Hook: the harness runs it',spawn:'Spawn: workflow starts an agent type',index:'Index: a skill names its own file',loads:'Loads another skill',calls:'Calls a script',mention:'Mention only (not a real route)'};
const KC = {root:'--k-root',rule:'--k-rule','rule-scoped':'--k-rule',settings:'--k-rule',skill:'--k-skill',workflow:'--k-workflow',agent:'--k-agent',hook:'--k-hook',reference:'--k-ref',template:'--k-ref',lessons:'--k-ref',history:'--k-other',config:'--k-other',script:'--k-script',other:'--k-other'};
const TABS = [['flow','Flow'],['trig','Triggers'],['router','Router & events'],['files','Files'],['issues','Issues']];
const store={get(k,d){try{const v=localStorage.getItem('kitflow.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('kitflow.'+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
const dot=(k,x='')=>`<b style="background:var(${KC[k]||'--k-other'});${x}"></b>`;
const nodes=D.nodes.filter(n=>!n.id.startsWith('.git'));const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
const edges=D.edges.filter(e=>byId[e.s]&&byId[e.t]);
const inCount={},outCount={};for(const e of edges){inCount[e.t]=(inCount[e.t]||0)+1;outCount[e.s]=(outCount[e.s]||0)+1}
const issuesOf=id=>D.issues.filter(i=>i.id===id);
const shown=store.get('types2',{route:1,scoped:1,hook:1,spawn:1,index:1,loads:0,calls:0,mention:0});
let expanded=new Set(store.get('expanded',[]));let sel=store.get('sel',null);if(sel&&!byId[sel])sel=null;
let tab=store.get('tab','flow');if(!TABS.some(t=>t[0]===tab))tab='flow';
const reached=nodes.filter(n=>n.reach==='entry'||n.reach==='structural').length;
document.getElementById('meta').textContent=`${D.kit} · generated ${D.generated}`;
{const pct=Math.round(100*reached/Math.max(1,nodes.length)),cnt=k=>nodes.filter(n=>n.kind===k).length;
 const K=[['Files',nodes.length],['Reached via flow',`${pct}%`,'',`<div class="bar"><i style="width:${pct}%"></i></div>`],['Links',edges.length],['Skills',cnt('skill')],['Workflows',cnt('workflow')],['Agent types',cnt('agent')],['Hooks',cnt('hook')],['Issues',D.issues.length,D.issues.length?'bad':'ok']];
 document.getElementById('kpis').innerHTML=K.map(([l,v,c,x])=>`<div class="kpi ${c||''}"><span>${l}</span><b>${v}</b>${x||''}</div>`).join('')}
const ib=document.getElementById('issuesBtn');ib.textContent=D.issues.length?`${D.issues.length} issues`:'✓ No issues';ib.className=D.issues.length?'warn':'good';if(!D.issues.length)ib.style.display='none';
const qEl=document.getElementById('q');const q=()=>qEl.value.trim().toLowerCase();
const hit=(n,s)=>!s||n.id.toLowerCase().includes(s)||(n.trigger||'').toLowerCase().includes(s);
const emptyOk=t=>`<div class="empty"><b>✓</b><span>${t}</span></div>`;
// ================= Flow: one swimlane per trigger group =================
const laneNames=[...new Set(nodes.filter(n=>n.col>0).map(n=>n.group))].sort((a,b)=>{const r=g=>g==='workflows'?'0':g==='agents'?'1':g==='kit'?'9':'2'+g;return r(a).localeCompare(r(b))});
const KORD={root:0,rule:1,'rule-scoped':2,settings:3,skill:0,workflow:0,agent:0,hook:1,reference:0,template:1,lessons:2,config:3,history:4,other:5,script:0};
const X=[24,340,700,1040],W=[280,310,310,290],RH=34,BIG=42,PAD=14;
const canvas=document.getElementById('canvas'),base=document.getElementById('base'),top_=document.getElementById('top');
let pos={},chipOf={};
function visible(id){const n=byId[id];if(!n)return false;if(n.col<=1)return true;return expanded.has(n.group)}
function shownId(id){return visible(id)?id:(chipOf[id]||null)}
function renderFlow(){
  canvas.querySelectorAll('.n,.lane,.lanehead,.colhead').forEach(e=>e.remove());pos={};chipOf={};
  for(const k of Object.keys(byId))if(k.startsWith('chip:'))delete byId[k];
  ['Entry · always-loaded, scoped, settings','Triggers · skills, workflows, agents, hooks','Step docs · reference, templates, lessons','Scripts'].forEach((t,c)=>{const h=document.createElement('div');h.className='colhead';h.style.left=X[c]+'px';h.textContent=t;canvas.appendChild(h)});
  let y0=42;for(const n of nodes.filter(n=>n.col===0).sort((a,b)=>KORD[a.kind]-KORD[b.kind]||a.label.localeCompare(b.label))){place(n,0,y0,true);y0+=BIG}
  let y=42;
  for(const g of laneNames){
    const ln=nodes.filter(n=>n.group===g&&n.col>0);const open=expanded.has(g);
    const cols=[1,2,3].map(c=>ln.filter(n=>n.col===c).sort((a,b)=>KORD[a.kind]-KORD[b.kind]||a.label.localeCompare(b.label)));
    const hasInner=cols[1].length+cols[2].length>0,warn=ln.filter(n=>n.reach==='none'||n.reach==='mention-only').length;
    const head=document.createElement('div');head.className='lanehead';head.style.left=(X[1]+2)+'px';head.style.top=(y+9)+'px';
    head.innerHTML=`<span class="car">${hasInner?(open?'▾':'▸'):'•'}</span>${esc(g)}<span class="sub">${hasInner?`${cols[1].length} docs · ${cols[2].length} scripts`:`${cols[0].length} ${g}`}</span>${warn?`<span class="warnc">⚠ ${warn}</span>`:''}`;
    if(hasInner)head.onclick=()=>{open?expanded.delete(g):expanded.add(g);store.set('expanded',[...expanded]);renderFlow();focus(sel)};
    canvas.appendChild(head);
    const yy=y+36;const rows=[0,0,0];
    cols[0].forEach((n,i)=>place(n,1,yy+i*BIG,true));rows[0]=cols[0].length*BIG;
    if(open){cols[1].forEach((n,i)=>place(n,2,yy+i*RH,false));cols[2].forEach((n,i)=>place(n,3,yy+i*RH,false));rows[1]=cols[1].length*RH;rows[2]=cols[2].length*RH}
    else{[[1,2,'docs'],[2,3,'scripts']].forEach(([ci,c,label])=>{if(!cols[ci].length)return;const id=`chip:${g}:${label}`;
      const bad=cols[ci].filter(n=>n.reach==='none'||n.reach==='mention-only').length;
      const chip={id,label:`＋ ${cols[ci].length} ${label}${bad?` · ${bad} ⚠`:''}`,kind:'chip',col:c,group:g,chip:true,members:cols[ci].map(n=>n.id)};
      byId[id]=chip;cols[ci].forEach(n=>chipOf[n.id]=id);place(chip,c,yy,false);rows[ci]=RH})}
    const h=Math.max(...rows,BIG)+36+PAD;
    const lane=document.createElement('div');lane.className='lane';lane.style.left=(X[1]-12)+'px';lane.style.top=y+'px';lane.style.width=(X[3]+W[3]-X[1]+24)+'px';lane.style.height=h+'px';canvas.insertBefore(lane,canvas.firstChild);
    y+=h+16;
  }
  const H=Math.max(y,y0)+20,Wd=X[3]+W[3]+40;canvas.style.width=Wd+'px';canvas.style.height=H+'px';
  for(const s of [base,top_]){s.setAttribute('width',Wd);s.setAttribute('height',H)}
  drawBase();markMatches();
}
function place(n,c,y,big){
  const el=document.createElement('div');const bad=n.reach==='none'&&n.kind!=='history',acc=n.reach==='mention-only';
  el.className='n'+(big?' big':'')+(n.local?' local':'')+(n.chip?' chip':'')+(bad?' bad':acc?' acc':'');
  el.style.left=X[c]+'px';el.style.top=y+'px';el.style.width=W[c]+'px';el.title=n.chip?'Click to expand':n.id;
  el.innerHTML=(n.chip?'':dot(n.kind))+`<span style="overflow:hidden;text-overflow:ellipsis">${esc(n.label)}</span>`+(big&&!n.chip?`<span class="tag">${esc(n.kind.replace('rule-scoped','scoped rule'))}</span>`:'');
  el.onclick=()=>{if(n.chip){expanded.add(n.group);store.set('expanded',[...expanded]);renderFlow();focus(sel);return}select(n.id)};
  el.onmouseenter=()=>{if(!n.chip)focus(n.id)};el.onmouseleave=()=>focus(sel);
  canvas.appendChild(el);n.el=el;pos[n.id]={x:X[c],y,w:W[c],h:big?32:26};
}
function curve(a,b){
  if(b.x>a.x+10){const x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2,m=Math.max(40,(x2-x1)/2);return `M${x1},${y1} C${x1+m},${y1} ${x2-m},${y2} ${x2},${y2}`}
  if(b.x<a.x-10){const x1=a.x,y1=a.y+a.h/2,x2=b.x+b.w,y2=b.y+b.h/2,m=Math.max(40,(x1-x2)/2);return `M${x1},${y1} C${x1-m},${y1} ${x2+m},${y2} ${x2},${y2}`}
  const x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x+b.w,y2=b.y+b.h/2,o=24+Math.min(90,Math.abs(y2-y1)/5);return `M${x1},${y1} C${x1+o},${y1} ${x2+o},${y2} ${x2},${y2}`;
}
function mapped(types,filter){
  const seen=new Set(),out=[];
  for(const e of edges){if(!types[e.type]||(filter&&!filter(e)))continue;const s=shownId(e.s),t=shownId(e.t);if(!s||!t||s===t)continue;const k=s+'>'+t+'>'+e.type;if(seen.has(k))continue;seen.add(k);out.push({s,t,type:e.type})}
  return out;
}
function draw(svg,list){svg.innerHTML='';for(const e of list){const a=pos[e.s],b=pos[e.t];if(!a||!b)continue;const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',curve(a,b));p.setAttribute('stroke',`var(--${e.type})`);if(e.type==='mention')p.setAttribute('stroke-dasharray','3 4');svg.appendChild(p)}}
function drawBase(){draw(base,mapped(shown))}
function focus(id){
  canvas.classList.toggle('dim',!!id);canvas.querySelectorAll('.n').forEach(e=>e.classList.remove('on','sel'));
  if(!id||!byId[id]){top_.innerHTML='';return}
  const want={...shown,loads:1,calls:1,index:1,route:1,scoped:1,hook:1,spawn:1};
  const ids=new Set(byId[id].chip?byId[id].members:[id]);
  const list=mapped(want,e=>ids.has(e.s)||ids.has(e.t));
  const ch=(byId[id].chain||[]);for(let i=1;i<ch.length;i++){const s=shownId(ch[i-1]),t=shownId(ch[i]);if(s&&t&&s!==t){const e=edges.find(e=>e.s===ch[i-1]&&e.t===ch[i]);list.push({s,t,type:e?e.type:'index'})}}
  draw(top_,list);
  const on=new Set([shownId(id)]);for(const e of list){on.add(e.s);on.add(e.t)}
  for(const k of on){const n=byId[k];if(n&&n.el)n.el.classList.add('on')}
  const me=byId[shownId(id)];if(me&&me.el)me.el.classList.add('sel');
}
function markMatches(){const s=q();canvas.querySelectorAll('.n').forEach(el=>el.classList.remove('match'));if(s)for(const n of nodes)if(n.el&&canvas.contains(n.el)&&hit(n,s))n.el.classList.add('match')}
// ================= Triggers: one card per trigger =================
const TKIND=[['skill','Skills'],['workflow','Workflows'],['agent','Agent types'],['hook','Hooks'],['rule-scoped','Path-scoped rules'],['rule','Always-loaded rules'],['root','Root']];
function card(n){
  const files=n.kind==='skill'?nodes.filter(m=>m.group===n.group&&m.id!==n.id).length:null;
  const iss=issuesOf(n.id).concat(n.kind==='skill'?D.issues.filter(i=>i.id&&i.id!==n.id&&byId[i.id]&&byId[i.id].group===n.group):[]);
  const bl=Object.entries(n.blocks||{});
  return `<div class="card${iss.length?' hasiss':''}"><h3>${dot(n.kind)}<a data-go="${esc(n.id)}">${esc(n.label)}</a>${iss.length?`<span class="pill bad">${iss.length} issues</span>`:`<span class="pill ${esc(n.reach)}">${files!==null?files+' files':esc(n.reach)}</span>`}</h3>
    ${n.local?'<span class="kind">local overlay</span>':''}
    ${bl.length?`<dl>${bl.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${md(v)}</dd>`).join('')}</dl>`:`<div class="trig">${md(n.trigger)}</div>`}
    ${iss.length?`<h3 class="sect" style="margin:12px 0 4px">Issues</h3>${iss.slice(0,6).map(i=>`<div class="iss"><em>${esc(i.type)}</em> ${i.id&&i.id!==n.id?link(i.id)+' — ':''}${esc(i.text)}</div>`).join('')}`:''}</div>`;
}
function renderTrig(){
  const s=q();let html='';
  for(const [k,l] of TKIND){const ts=nodes.filter(n=>n.kind===k&&hit(n,s)).sort((a,b)=>a.label.localeCompare(b.label));if(!ts.length)continue;
    html+=`<div class="sect">${l} <span class="meta">${ts.length}</span></div><div class="cards">${ts.map(card).join('')}</div>`}
  document.getElementById('v-trig').innerHTML=html||'<div class="meta">no trigger matches</div>';
}
// ================= Router & events: the always-loaded tables =================
function renderRouter(){
  const s=q();
  document.getElementById('v-router').innerHTML=(D.tables||[]).map(t=>{
    const rows=t.rows.map((r,i)=>[r,t.links[i]||[]]).filter(([r])=>!s||r.join(' ').toLowerCase().includes(s));
    if(!rows.length)return '';
    return `<div class="sect">${esc(t.heading||'(no heading)')} <span class="meta">· <a data-go="${esc(t.file)}">${esc(t.file)}</a> · ${rows.length} rows</span></div>
    <table class="t"><thead><tr>${t.head.map(h=>`<th>${md(h)}</th>`).join('')}<th>Goes to</th></tr></thead><tbody>${rows.map(([r,l])=>`<tr>${r.map((c,i)=>`<td${i===0?' style="font-weight:650;white-space:nowrap"':''}>${md(c)}</td>`).join('')}<td>${l.map(id=>`<span class="gl">${link(id)}</span>`).join('')||'<span class="meta">—</span>'}</td></tr>`).join('')}</tbody></table>`}).join('')||'<div class="meta">no tables match</div>';
}
// ================= Files: sortable, filterable =================
let fsort=store.get('fsort',['id',1]),fkind='',freach='';
function renderFiles(){
  const s=q();const kinds=[...new Set(nodes.map(n=>n.kind))].sort(),reaches=['entry','structural','mention-only','none'];
  const rows=nodes.filter(n=>hit(n,s)&&(!fkind||n.kind===fkind)&&(!freach||n.reach===freach)).map(n=>({n,id:n.id,kind:n.kind,reach:n.reach,in:inCount[n.id]||0,out:outCount[n.id]||0,trigger:n.trigger||''}));
  const [k,dir]=fsort;rows.sort((a,b)=>(typeof a[k]==='number'?a[k]-b[k]:String(a[k]).localeCompare(String(b[k])))*dir);
  const cols=[['id','Path'],['kind','Kind'],['reach','Reach'],['in','In'],['out','Out'],['trigger','Trigger / step']];
  document.getElementById('v-files').innerHTML=`<div class="filters">
    <select id="fk"><option value="">All kinds</option>${kinds.map(x=>`<option${x===fkind?' selected':''}>${esc(x)}</option>`).join('')}</select>
    <select id="fr"><option value="">Any reach</option>${reaches.map(x=>`<option${x===freach?' selected':''}>${esc(x)}</option>`).join('')}</select>
    <span class="meta">${rows.length} of ${nodes.length} files · click a column to sort</span></div>
    <table class="t" id="ftab"><thead><tr>${cols.map(([c,l])=>`<th data-k="${c}">${l}${c===k?(dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="p">${dot(r.kind,'display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:8px')}<a data-go="${esc(r.id)}">${esc(r.id)}</a></td><td>${esc(r.kind)}</td><td><span class="pill ${esc(r.reach)}">${esc(r.reach)}</span></td><td class="num">${r.in}</td><td class="num">${r.out}</td><td>${md(r.trigger.slice(0,160))}</td></tr>`).join('')}</tbody></table>`;
  document.getElementById('fk').onchange=e=>{fkind=e.target.value;renderFiles()};
  document.getElementById('fr').onchange=e=>{freach=e.target.value;renderFiles()};
  document.querySelectorAll('#ftab th').forEach(th=>th.onclick=()=>{const c=th.dataset.k;fsort=[c,fsort[0]===c?-fsort[1]:1];store.set('fsort',fsort);renderFiles()});
}
// ================= Issues: grouped =================
function issuesHtml(){
  const s=q(),by={};for(const i of D.issues){if(s&&!((i.id||'')+' '+i.text+' '+i.type).toLowerCase().includes(s))continue;(by[i.type]=by[i.type]||[]).push(i)}
  return Object.entries(by).map(([t,is])=>`<div class="sect">${esc(t)} <span class="meta">${is.length}</span></div>${is.map(i=>`<div class="iss">${i.code?`<span class="pill bad">${esc(i.code)}</span> `:''}${i.id?link(i.id)+' — ':''}${esc(i.text)}</div>`).join('')}`).join('')||emptyOk('No issues: every file is reached through the flow and every trigger is explicit.');
}
function renderIssues(){document.getElementById('v-issues').innerHTML=`<div class="sect">Issues <span class="meta">the same list kit-lint.py prints; fix them in the kit source and re-run it</span></div>${issuesHtml()}`}
// ================= side panel (every tab) =================
const sideEl=document.getElementById('side');
const link=id=>{const n=byId[id];return n?`<a data-go="${esc(id)}">${esc(n.label)}</a>`:esc(id)};
function side(id){
  if(!id||!byId[id]||byId[id].chip){sideEl.innerHTML=overview();return}
  const n=byId[id],inn=edges.filter(e=>e.t===id),out=edges.filter(e=>e.s===id);

  <span class="kind">${esc(n.kind)}</span>${n.local?'<span class="kind">local overlay</span>':''}<span class="pill ${esc(n.reach)}">${esc(n.reach)}</span>
  ${n.trigger&&!bl.length?`<div class="trig">${md(n.trigger)}</div>`:''}${bl.length?`<div class="card" style="margin:12px 0;box-shadow:none"><dl style="margin:0">${bl.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${md(v)}</dd>`).join('')}</dl></div>`:''}<div class="meta">${rt}</div>
  ${n.chain&&n.chain.length>1?`<h3>How an agent gets here</h3><div class="chain">${n.chain.map(link).join('<span>→</span>')}</div>`:''}
  <h3>Reached from · ${inn.length}</h3><ul class="lst">${inn.map(e=>`<li><span class="et">${e.type}</span>${link(e.s)}</li>`).join('')||'<li class="meta">nothing</li>'}</ul>
  <h3>Leads to · ${out.length}</h3><ul class="lst">${out.map(e=>`<li><span class="et">${e.type}</span>${link(e.t)}</li>`).join('')||'<li class="meta">nothing</li>'}</ul>
  ${issuesOf(id).map(i=>`<div class="iss"><em>${esc(i.type)}</em> ${esc(i.text)}</div>`).join('')}`;

function overview(){
  return `<h2>How to read this</h2><div class="meta">Flow: each band is one trigger (a skill, the workflows, the agent types); entry files on the left route into them. Click ▸ or a dashed chip to open a band's docs and scripts. Hover or click a file to draw every link it has, on top. The other tabs list trigger cards, the router and events tables, every file and the issues.</div>
  <h3>Link types</h3><div class="legend">${Object.entries(ET).map(([t,l])=>`<i style="width:22px;height:3px;border-radius:2px;background:var(--${t})"></i><span>${l}</span>`).join('')}</div>
  <h3>Markers</h3><div class="legend"><span style="border-left:3px solid var(--bad);padding-left:6px">red</span><span>unreached</span><span style="border-left:3px solid var(--hi);padding-left:6px">amber</span><span>reached only by a mention</span><span style="border:1px dashed var(--line2);padding:0 6px;border-radius:5px">dashed</span><span>local overlay (not published)</span></div>
  <h3>Issues · ${D.issues.length}</h3>${issuesHtml()}`;
}
function select(id){sel=id;store.set('sel',id);if(tab==='flow')focus(id);side(id)}
function go(id){
  const n=byId[id];if(!n)return;
  if(tab==='flow'){if(n.col>1&&!expanded.has(n.group)){expanded.add(n.group);store.set('expanded',[...expanded]);renderFlow()}
    select(id);const p=pos[id];if(p)document.getElementById('v-flow').scrollTo({top:p.y-140,left:Math.max(0,p.x-260),behavior:'smooth'});return}

document.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();go(a.dataset.go)}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==qEl){e.preventDefault();qEl.focus()}else if(e.key==='Escape'){if(document.activeElement===qEl&&qEl.value){qEl.value='';qEl.oninput()}else select(null)}});
ib.onclick=()=>setTab('issues');
// ================= tabs + toolbar =================
const R={flow:()=>{renderFlow();focus(sel)},trig:renderTrig,router:renderRouter,files:renderFiles,issues:renderIssues};
const tabsEl=document.getElementById('tabs');
const tabCount={flow:laneNames.length,trig:nodes.filter(n=>TKIND.some(t=>t[0]===n.kind)).length,router:(D.tables||[]).length,files:nodes.length,issues:D.issues.length};
for(const [k,l] of TABS){const b=document.createElement('button');b.innerHTML=`${l}<span class="cnt${k==='issues'&&D.issues.length?' bad':''}">${tabCount[k]}</span>`;b.dataset.t=k;b.onclick=()=>setTab(k);tabsEl.appendChild(b)}
function setTab(t){tab=t;store.set('tab',t);document.body.dataset.tab=t;
  tabsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('act',b.dataset.t===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('act',v.id==='v-'+t));R[t]()}
const tgs=document.getElementById('tgs');
for(const t of Object.keys(ET)){const s=document.createElement('span');s.className='tg'+(shown[t]?'':' off');s.innerHTML=`<i style="background:var(--${t})"></i>${t}`;s.title=ET[t];
  s.onclick=()=>{shown[t]=shown[t]?0:1;s.classList.toggle('off',!shown[t]);store.set('types2',shown);drawBase();focus(sel)};tgs.appendChild(s)}

const root=document.documentElement;root.dataset.theme=store.get('theme','')||'';document.getElementById('theme').onclick=()=>{const t=root.dataset.theme==='dark'?'light':root.dataset.theme==='light'?'':'dark';root.dataset.theme=t;store.set('theme',t)};
