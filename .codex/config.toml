# Generated by kitbag.py port from settings.json; the logic lives in crafty.ps1 / bossy.ps1.
project_doc_max_bytes = 65536
approval_policy = "never"
sandbox_mode = "workspace-write"

[features]
memories = false

[sandbox_workspace_write]
network_access = true

[shell_environment_policy]
set = { KIT_TOOL = "codex" }

[[hooks.PreToolUse]]
matcher = "^(Bash|apply_patch|mcp__.*(sql|query).*)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = '''node .claude/skills/crafty/guard_client.mjs'''
timeout = 10

[[hooks.SessionStart]]
matcher = "*"

[[hooks.SessionStart.hooks]]
type = "command"
command = '''pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .claude/skills/bossy/bossy.ps1 health'''
timeout = 15

[[hooks.SessionStart]]
matcher = "*"

[[hooks.SessionStart.hooks]]
type = "command"
command = '''pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .claude/skills/bossy/bossy.ps1 cleanup -IfDue -Quiet'''
timeout = 600
async = true

[[hooks.SessionStart]]
matcher = "*"

[[hooks.SessionStart.hooks]]
type = "command"
command = '''pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .claude/skills/bossy/bossy.ps1 health -Flow -Fetch'''
timeout = 120
async = true
